<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AI 责任认知 · 互动问卷</title>
<style>
/* ===== 星露谷风暖色调 + 高对比度 ===== */
:root{
  --bg:#1a1526; --night:#241a30; --panel:#2e2338; --panel2:#3a2d48;
  --wood:#7a5230; --wood-d:#4a3020;
  --gold:#f0b429; --ink:#f7efd8; --ink-dim:#c4b493;
  --neon:#7fe7ec; --warm:#ffb85c; --alarm:#ef5350; --ok:#7bc86c;
  --glass:#cfe6ff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden;-webkit-text-size-adjust:100%;
  font-family:'Zpix','Fusion Pixel','Microsoft YaHei','SimHei',monospace;-webkit-font-smoothing:none}
body{position:fixed;left:0;top:0;right:0;bottom:0;touch-action:manipulation}
#stage{position:absolute;left:50%;top:50%;width:480px;height:540px;
  margin:-270px 0 0 -240px;transform-origin:center center;background:var(--bg);overflow:hidden;
  touch-action:manipulation}

#fx{position:absolute;left:0;top:0;width:480px;height:540px;pointer-events:none;z-index:3}
#sv{position:absolute;left:0;top:0;width:480px;height:270px;z-index:2}
#drive{position:absolute;left:0;top:0;width:480px;height:270px;z-index:2;display:none}
.sc{display:none}
.sc.on{display:block}
.shake{animation:shk .08s steps(2) infinite}
@keyframes shk{0%{transform:translate(0,0)}50%{transform:translate(2px,-1px)}100%{transform:translate(-2px,1px)}}
#flash{position:absolute;left:0;top:0;width:480px;height:270px;background:#fff;opacity:0;pointer-events:none;z-index:4}
/* 撞后头晕：血色晕影 + 缓慢漂移 */
#dizzy{position:absolute;left:0;top:0;width:480px;height:270px;z-index:5;pointer-events:none;display:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(150,32,32,.16) 74%,rgba(120,20,20,.3) 100%)}
#dizzy.on{display:block;animation:dizzysway 3.8s ease-in-out infinite}
@keyframes dizzysway{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(1.6px,-1.1px)}
  40%{transform:translate(-1.6px,1.2px)}
  60%{transform:translate(1.1px,1.6px)}
  80%{transform:translate(-1.1px,-1.3px)}
}
/* 场景层撞后轻微摇摆 + 模糊去饱和 */
#sv.diz,#drive.diz{animation:scenediz 5.2s ease-in-out infinite;filter:blur(.5px) saturate(.8)}
@keyframes scenediz{
  0%,100%{transform:translate(0,0) rotate(0)}
  25%{transform:translate(2.2px,-1.2px) rotate(.35deg)}
  50%{transform:translate(-2.2px,1.4px) rotate(-.28deg)}
  75%{transform:translate(1.2px,2px) rotate(.22deg)}
}
/* 报纸升起 */
#news{opacity:0;pointer-events:none}
#news.on{opacity:1;pointer-events:auto;animation:newsraise .55s ease-out}
@keyframes newsraise{
  from{transform:translateY(150px);opacity:0}
  to{transform:translateY(0);opacity:1}
}
/* 撞击红灯警报 */
#alarm{position:absolute;left:0;top:0;width:480px;height:270px;background:rgba(255,40,40,.4);
  opacity:0;pointer-events:none;z-index:4}
#alarm.on{animation:alarmblink .55s steps(2) 3}
@keyframes alarmblink{0%,100%{opacity:0}50%{opacity:1}}
#prog{position:absolute;left:0;top:0;height:3px;background:var(--gold);z-index:9;width:0;transition:width .3s}

/* UI 层 */
#ui{position:absolute;left:0;top:270px;width:480px;height:270px;z-index:4;padding:6px 24px 0}
#panel{position:relative;min-height:54px;max-height:104px;background:var(--panel);
  border:2px solid var(--wood);box-shadow:inset 0 0 0 1px var(--gold);
  padding:9px 11px;font-size:12.5px;line-height:19px;color:var(--ink);overflow-y:auto;
  overflow-x:hidden;word-break:break-all}
#panel .dim{color:var(--ink-dim);font-size:11px}
#arrow{position:absolute;right:8px;bottom:3px;color:var(--gold);font-size:10px;
  opacity:0;animation:bl 1s steps(2) infinite}
#arrow.on{opacity:1}
@keyframes bl{50%{opacity:0}}

/* 卡片组（责任主体 / 线索） */
#cards{margin-top:8px;overflow-y:auto;max-height:196px;touch-action:pan-y}
.cd{display:flex;margin-bottom:5px;background:var(--panel2);border:1px solid var(--wood);
  padding:5px 8px;border-radius:2px}
.cd .ci{flex:0 0 22px;color:var(--gold);font-size:11px;line-height:17px}
.cd .cb2{flex:1}
.cd .ct{font-size:12px;color:var(--warm);line-height:17px}
.cd .cdd{font-size:10.5px;color:var(--ink-dim);line-height:15px}
.clue{background:var(--panel2);border:1px solid var(--gold);padding:8px 10px;margin-bottom:6px}
.clue .ctag{font-size:10px;color:var(--gold);letter-spacing:.2em}
.clue .ctit{font-size:13px;color:var(--warm);margin:4px 0}
.clue .cbody{font-size:11px;color:var(--ink);line-height:17px}

/* 选项 */
#opts{margin-top:8px;max-height:196px;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;touch-action:pan-y}
.opt{min-height:21px;margin-bottom:4px;padding:3px 8px;display:flex;align-items:center;
  font-size:11.5px;line-height:16px;color:var(--ink);background:var(--panel);
  border:1px solid var(--wood);cursor:pointer}
.opt:hover,.opt.hl{background:var(--panel2);border-color:var(--gold);color:#fff}
.opt:active{transform:translateY(1px)}
.opt .mk{width:16px;flex:0 0 16px;color:var(--gold)}
.opt.sel{background:var(--gold);color:#241a30;border-color:var(--gold)}
.opt.sel .mk{color:#241a30}
.opt .ord{margin-left:auto;padding-left:6px;font-size:10px;color:var(--gold)}
.opt.sel .ord{color:#241a30}

/* 底部 */
#foot{position:absolute;left:24px;right:24px;bottom:8px;display:flex;align-items:center;gap:8px}
#back{flex:0 0 auto;padding:3px 10px;font-size:11px;color:var(--ink-dim);
  background:var(--panel);border:1px solid var(--wood);cursor:pointer;font-family:inherit;display:none}
#back.on{display:block}
#back:active{transform:translateY(1px)}
#qtype{flex:1;font-size:10px;color:var(--ink-dim);text-align:center}
#warn{font-size:10px;color:var(--alarm);opacity:0;transition:opacity .2s}
#warn.on{opacity:1}
#ok{padding:3px 16px;font-size:12px;color:var(--gold);background:var(--panel);
  border:1px solid var(--gold);cursor:pointer;display:none;font-family:inherit}
#ok.on{display:block}
#ok:disabled{opacity:.4;cursor:not-allowed}
#ok:active{transform:translateY(1px)}

/* 矩阵 / 分配 */
#mx{margin-top:8px}
.mrow{display:flex;align-items:center;margin-bottom:5px}
.mlab{width:92px;flex:0 0 92px;font-size:10.5px;color:var(--ink);line-height:13px}
.mcel{flex:1;display:flex;gap:2px}
.mbtn{flex:1;text-align:center;padding:3px 0;font-size:9.5px;color:var(--ink-dim);
  background:var(--panel);border:1px solid var(--wood);cursor:pointer}
.mbtn.sel{background:var(--gold);color:#241a30;border-color:var(--gold)}
.mhead{display:flex;margin-bottom:4px}
.mhead .mlab{color:var(--ink-dim);font-size:9px}
.mhead .mcel{justify-content:space-around;color:var(--ink-dim);font-size:9px}
/* 填空分配 */
.ain{width:60px;height:22px;margin:0 6px;padding:2px 6px;font-size:12px;text-align:center;
  color:var(--ink);background:var(--panel);border:1px solid var(--wood);font-family:inherit;
  -moz-appearance:textfield}
.ain::-webkit-outer-spin-button,.ain::-webkit-inner-spin-button{-webkit-appearance:none}
.asum{margin-top:4px;font-size:11px;color:var(--ink);text-align:right}
.asum b{color:var(--gold);font-size:13px}
.asum.good b{color:var(--ok)}

/* 文本输入 */
#txin{display:none;margin-top:8px;width:100%;height:70px;padding:6px;
  font-size:11.5px;line-height:16px;color:var(--ink);background:var(--panel);
  border:1px solid var(--wood);font-family:inherit;resize:none}
#txin.on{display:block}

/* 卡片（幕间 / 结局 / 画像） */
#card{position:absolute;left:0;top:0;width:480px;height:540px;display:none;
  flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:var(--bg);z-index:20;padding:0 40px}
#card.on{display:flex}
#card .ct{font-size:15px;color:var(--gold);letter-spacing:.3em;margin-bottom:14px}
#card .hr{width:150px;height:1px;background:var(--gold);margin-bottom:14px}
#card .cs{font-size:11.5px;line-height:19px;color:var(--ink-dim);max-width:340px;margin-bottom:16px}
.cb{padding:5px 18px;margin:4px;font-size:12px;color:var(--gold);background:transparent;
  border:2px solid var(--gold);cursor:pointer;font-family:inherit}
.cb:hover{background:var(--gold);color:var(--night)}
/* 责任画像柱 */
#portrait{width:320px;margin:0 auto 14px}
.prow{display:flex;align-items:center;margin-bottom:7px}
.plab{width:86px;flex:0 0 86px;font-size:10px;color:var(--ink);text-align:right;padding-right:6px}
.pbar{flex:1;height:14px;background:var(--panel);border:1px solid var(--wood);overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--warm),var(--gold));transition:width .8s ease-out}
.pval{width:34px;flex:0 0 34px;font-size:10px;color:var(--gold);padding-left:5px}
#err{position:absolute;left:0;top:0;right:0;z-index:99;background:var(--alarm);color:#fff;
  font-size:11px;padding:5px 8px;display:none;font-family:monospace}
</style>
</head>

<script>
/* ================= 后端接口配置 ================= */
window.QS_CONFIG = { api:'/api/submit', token:'', exportName:'ai-survey' };

window.onerror = (m,s,l)=>{
  const e=document.getElementById('err'); e.style.display='block';
  e.textContent='脚本错误: '+m+' (行 '+l+')';
};

const cv=$('#fx'),cx=cv.getContext('2d');const P=[];let mode='rain';
function burst(x,y,n,c,spd){for(let i=0;i<n;i++){if(P.length>=240)break;const a=Math.random()*Math.PI*2,v=spd*(0.4+Math.random());
  P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:1,decay:0.02,size:1+Math.random()*2,c,g:0.25});}}
function tick(){
  cx.clearRect(0,0,480,540);
  if(mode==='rain'&&P.length<170)for(let i=0;i<2;i++)P.push({x:Math.random()*520-20,y:-10,vx:-1.1,vy:9+Math.random()*4,life:1,decay:0,size:1,c:'rgba(160,190,225,.55)',g:0,rain:true});
  if(mode==='stars'&&P.length<70&&Math.random()<.35)P.push({x:Math.random()*480,y:Math.random()*220,vx:0,vy:-0.06,life:1,decay:0.0015,size:1,c:'rgba(225,235,255,.8)',g:0});
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;
    if(p.rain){if(p.y>270){if(P.length<210)P.push({x:p.x,y:268,vx:.6,vy:-1.6,life:1,decay:.09,size:1,c:'rgba(160,190,225,.5)',g:.12});P.splice(i,1);continue;}}
    else{p.life-=p.decay;if(p.life<=0||p.y>560||p.x<-30||p.x>510){P.splice(i,1);continue;}}
    cx.globalAlpha=p.rain?1:Math.max(0,Math.min(1,p.life));cx.fillStyle=p.c;
    cx.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size*(p.rain?3:1));}
  cx.globalAlpha=1;requestAnimationFrame(tick);
}tick();

/* 逻辑分辨率画布：像素完美 */
const LW=240, LH=135;

/* 驾驶调色板（星露谷暗夜系） */
const PAL={sky:'#0c111e',skyFar:'#121a2c',build:'#161f30',
  road0:'#1a2232',road1:'#1e2838',line:'#c8a850',curb:'#33415a',
  tree:'#13210f',treeLit:'#1d3018',pole:'#28324a',lamp:'#ffb85c',

function seedLights(){
  lights=[];
  for(let i=0;i<14;i++) lights.push({z:2+i*1.6, side:(i%2)?1:-1, kind:(i%4===0)?'tree':'light'});
}
/* 场景绘制（逻辑坐标 240×135，全部整数对齐） */
function drawDriveScene(){
  const c=lctx;
  c.fillStyle=PAL.sky; c.fillRect(0,0,240,HZ+2);
  c.fillStyle=PAL.build;
  for(let i=0;i<11;i++){ const bx=i*23, bh=5+((i*13)%9); c.fillRect(bx,HZ-bh,17,bh); }
  for(let y=HZ; y<BTB; y++){
    const z=CMD/(y-HZ+1), half=Math.min(130,FOC*1.05/z);
    c.fillStyle=((y>>1)%2)?PAL.road0:PAL.road1;
    c.fillRect(Math.round(CX-half), y, Math.round(half*2), 1);
    if(((driveT>>2)+(y>>1))%6<2){ c.fillStyle=PAL.line; c.fillRect(CX-1,y,2,1); }
  }
  c.fillStyle=PAL.curb;
  for(let y=HZ; y<BTB; y++){
    const z=CMD/(y-HZ+1), half=Math.min(130,FOC*1.05/z);
    c.fillRect(Math.round(CX-half),y,1,1); c.fillRect(Math.round(CX+half),y,1,1);
  }
  lights.forEach(o=>{
    const s=FOC/o.z, py=Math.round(HZ+CMD/o.z), px=Math.round(CX+o.side*1.6*s);
    if(o.kind==='light'){
      const h=Math.round(26*s);
      c.fillStyle=PAL.pole; c.fillRect(px-1, py-h, 2, h);
      c.fillStyle=PAL.lamp; c.fillRect(px-2, py-h-2, 4, 2);
      c.fillStyle='rgba(255,184,92,.12)'; c.fillRect(px-5, py-h-6, 10, 10);
    } else {
      const h=Math.round(22*s), w=Math.round(10*s);
      c.fillStyle=PAL.tree; c.fillRect(px-(w>>1), py-h, w, h);
      c.fillStyle=PAL.treeLit; c.fillRect(px-(w>>2), py-(h*2/3|0), w>>1, h>>1);
    }
  });
  if(pedActive){
    const s=FOC/pedZ, py=Math.round(HZ+CMD/pedZ), px=Math.round(CX+0.3*s);
    const h=Math.round(20*s), w=Math.max(2,Math.round(7*s));
    c.fillStyle=PAL.skin; c.fillRect(px-(w>>1), py-h, w, Math.round(h*0.3));
    c.fillStyle=PAL.cloth; c.fillRect(px-(w>>1), py-(h*0.7|0), w, Math.round(h*0.7));
    c.fillStyle=PAL.dark; c.fillRect(px-(w>>1), py-(h*0.3|0), Math.round(w*0.46), Math.round(h*0.3));
    c.fillRect(px+1, py-(h*0.3|0), Math.round(w*0.46), Math.round(h*0.3));
  }
  c.strokeStyle=PAL.rain; c.lineWidth=1;
  for(let i=0;i<30;i++){
    const rx=((i*71+driveT*4)%260)-10, ry=(i*37+driveT*7)%140;
    c.beginPath(); c.moveTo(rx,ry); c.lineTo(rx-3,ry+9); c.stroke();
  }
}
/* HUD 用显示分辨率画，保证文字清晰 */
function drawHUD(c){
  c.fillStyle=PAL.dash; c.fillRect(176,170,128,52);
  c.strokeStyle=PAL.dashEdge; c.lineWidth=2; c.strokeRect(176,170,128,52);
  c.fillStyle=hmiC; c.font='10px monospace';
  c.fillText('自动驾驶',188,190);
  c.fillText('已接管 · 60 km/h',188,206);
}

function renderDrive(){
  if(!driveOn) return;
  drawDriveScene();
  dctx.imageSmoothingEnabled=false;
  dctx.drawImage(lowCv, 0, 0, 480, 270);
  drawHUD(dctx);
  dctx.strokeStyle='#181820'; dctx.lineWidth=20;
  dctx.beginPath(); dctx.arc(240,300,92,Math.PI,Math.PI*2); dctx.stroke();
  dctx.strokeStyle='#282830'; dctx.lineWidth=13;
  dctx.beginPath(); dctx.arc(240,300,92,Math.PI,Math.PI*2); dctx.stroke();
  dctx.fillStyle='#f0c8a0'; dctx.fillRect(178,238,26,16); dctx.fillRect(276,238,26,16);
  dctx.fillStyle='#d8a878'; dctx.fillRect(178,238,26,4); dctx.fillRect(276,238,26,4);
  driveT++;
  lights.forEach(o=>o.z-=0.09);
  lights=lights.filter(o=>o.z>0.5);
  let mz=lights.length?Math.max.apply(null,lights.map(o=>o.z)):0;
  while(mz<25){ mz+=1.6; lights.push({z:mz, side:(lights.length%2)?1:-1, kind:(lights.length%5===0)?'tree':'light'}); }
  if(pedActive){ pedZ-=0.07; if(pedZ<=0.9){ crashHit(); return; } }
  requestAnimationFrame(renderDrive);
}
function crashHit(){
  pedActive=false; driveOn=false; drive.style.display='none'; hmiC='#ef5350';
  dizzyOn=true;
  setScene('car', {hmi:['碰撞警告','系统异常','#ef5350'], crack:true});
  stage.classList.add('shake');
  flash.style.transition='none'; flash.style.opacity='.9';
  setTimeout(()=>{flash.style.transition='opacity .5s'; flash.style.opacity='0';},70);
  setTimeout(()=>stage.classList.remove('shake'),620);
  // 红灯警报闪烁
  const al=$('#alarm'); al.classList.remove('on'); void al.getBoundingClientRect();
  al.classList.add('on');
  setTimeout(()=>al.classList.remove('on'),1700);
  burst(300,180,45,'#cfe6ff',5); burst(300,180,24,'#ffb85c',3.5); burst(300,180,12,'#ef5350',4);
  showText('撞击。');
}

  if(opt&&opt.drive){
    document.querySelectorAll('.sc').forEach(g=>g.classList.remove('on'));
    drive.style.display='block';
    curScene='car'; mode='none'; P.length=0;
    if(!driveOn){ seedLights(); driveOn=true; renderDrive(); }
    if(opt.ped){ pedActive=true; pedZ=9; }
    return;
  }
  drive.style.display='none';
  if(curScene!==id){
    document.querySelectorAll('.sc').forEach(g=>g.classList.remove('on'));
    const el=document.getElementById(MAP[id]||'sc-room');if(el)el.classList.add('on');
    curScene=id;mode=(id==='stars')?'stars':'rain';P.length=0;
  }
  if(id==='car'&&opt){
    if(opt.hmi){$('#hmi1').textContent=opt.hmi[0];$('#hmi2').textContent=opt.hmi[1];
      $('#hmi1').setAttribute('fill',opt.hmi[2]);$('#hmi2').setAttribute('fill',opt.hmi[2]);
      $('#led').setAttribute('fill',opt.hmi[2]);}
    $('#ped').style.display=opt.ped?'block':'none';
    $('#crack').style.display=(opt.crack||dizzyOn)?'block':'none';
  }
  // 撞后头晕：仅事故场景（car）持续，切到其它幕自动解除
  const dz = dizzyOn && id==='car';
  $('#dizzy').classList.toggle('on', dz);
  $('#sv').classList.toggle('diz', dz);
  $('#drive').classList.toggle('diz', dz);
}

/* ================= 显示 ================= */
function showText(html){ptxt.innerHTML=html;arrow.classList.add('on');panel.scrollTop=0;}
function esc(s){return String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function clearUI(){
  opts.innerHTML='';opts.style.display='none';
  cards.innerHTML='';cards.style.display='none';
  mxEl.innerHTML='';mxEl.style.display='none';
  txin.classList.remove('on');txin.value='';
  ok.classList.remove('on');ok.disabled=false;ok.onclick=null;
  back.classList.remove('on');
  warn.classList.remove('on');qtype.textContent='';
  sel=[];ord=[];mxRow={};
}

/* ================= 卡片组 ================= */
function showCards(list){cards.style.display='block';cards.innerHTML='';
  list.forEach((c,i)=>{const d=document.createElement('div');d.className='cd';
    d.innerHTML='<div class="ci">'+(i+1)+'</div><div class="cb2"><div class="ct">'+c.t+'</div>'+
      (c.d?'<div class="cdd">'+c.d+'</div>':'')+'</div>';
    cards.appendChild(d);});}
function wrapCN(t,max){const a=[];for(let i=0;i<t.length;i+=max)a.push(t.slice(i,i+max));return a;}
function showNews(q){
  setScene('car');
  const L=wrapCN(q.info,24);
  $('#newsT').textContent=q.clue;
  $('#newsB1').textContent=L[0]||'';
  $('#newsB2').textContent=L[1]||'';
  $('#newsB3').textContent=L[2]||'';
  const n=$('#news');
  n.classList.remove('on'); void n.getBoundingClientRect();
  n.classList.add('on');
  cards.style.display='block';cards.innerHTML='';
  const b=document.createElement('div');b.className='opt';b.style.marginTop='4px';
  b.innerHTML='<span class="mk">▶</span><span>放下报纸，继续评估</span>';
  b.onclick=()=>{n.classList.remove('on');cards.style.display='none';cards.innerHTML='';renderMatrix(q);};
  cards.appendChild(b);
}

/* ================= 选项 ================= */
const valOf=c=>c.dataset.val||(opts._list?opts._list[+c.dataset.i]:'');
const collect=()=>[...opts.children].filter(c=>c.classList.contains('sel')).map(valOf);
function renderOpts(list,type){
  opts._list=list;opts.innerHTML='';opts.style.display='block';
  list.forEach((t,i)=>{const d=document.createElement('div');d.className='opt';d.dataset.i=i;
    d.innerHTML='<span class="mk">'+'ABCDEFGHIJ'[i]+'</span><span>'+esc(t)+'</span>';
    d.onclick=()=>onOpt(d,i,list,type);opts.appendChild(d);});
}
function needOk(){ok.classList.add('on');ok.onclick=()=>{
  if(!sel.length){warn.textContent='请至少选一项';warn.classList.add('on');setTimeout(()=>warn.classList.remove('on'),1400);return;}
  data_set();advanceQ();};}
function onOpt(el,i,list,type){
  if(clickLock)return;
  if(/其他/.test(list[i])){const v=prompt('请填写「其他」内容（可留空）');if(v===null)return;
    el.dataset.val=list[i].replace(/[：:].*$/,'')+'：'+(v||'');}
  if(type==='s'){clickLock=true;[...opts.children].forEach(c=>c.classList.remove('sel'));
    el.classList.add('sel');sel=[valOf(el)];burst(240,300,6,'#f0b429',2.2);
    setTimeout(()=>{clickLock=false;data_set();advanceQ();},200);return;}
  const lim=(type==='l3')?3:(type==='m'?99:2);
  const mutualIdx=(type==='l2m')?list.length-2:-1;
  if(i===mutualIdx){[...opts.children].forEach(c=>c.classList.remove('sel'));el.classList.add('sel');}
  else{if(el.classList.contains('sel'))el.classList.remove('sel');
    else{if(sel.length>=lim){warn.textContent='最多选 '+lim+' 项';warn.classList.add('on');setTimeout(()=>warn.classList.remove('on'),1400);return;}
      el.classList.add('sel');}
    if(mutualIdx>=0){const mi=opts.children[mutualIdx];if(mi&&mi!==el)mi.classList.remove('sel');}}
  if(type==='l3'){const k=ord.indexOf(i);if(k>=0)ord.splice(k,1);else if(el.classList.contains('sel'))ord.push(i);
    [...opts.children].forEach((c,j)=>{const o=c.querySelector('.ord');if(o)o.remove();const p=ord.indexOf(j);
      if(p>=0){const s=document.createElement('span');s.className='ord';s.textContent='第'+(p+1);c.appendChild(s);}});
    sel=ord.map(j=>valOf(opts.children[j]));}
  else sel=collect();
  needOk();
}

/* ================= 矩阵 ================= */
function renderMatrix(q){
  mxEl.style.display='block';mxEl.innerHTML='';
  const head=document.createElement('div');head.className='mhead';
  head.innerHTML='<span class="mlab">责任主体</span><span class="mcel">'+SCALE.map(s=>'<span>'+s+'</span>').join('')+'</span>';
  mxEl.appendChild(head);
  SUBJ.forEach((sub,r)=>{const row=document.createElement('div');row.className='mrow';
    const lab=document.createElement('span');lab.className='mlab';lab.textContent=sub;
    const cel=document.createElement('span');cel.className='mcel';
    SCALE.forEach((sc,c)=>{const b=document.createElement('span');b.className='mbtn';b.textContent=sc.slice(0,2);b.title=sc;
      b.onclick=()=>{[...cel.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel');mxRow[r]=c;
        burst(240,300,5,'#f0b429',2);checkMatrix();};cel.appendChild(b);});
    row.appendChild(lab);row.appendChild(cel);mxEl.appendChild(row);});
  qtype.textContent='4 个主体均需作答';
  checkMatrix();
}
function checkMatrix(){if(Object.keys(mxRow).length===4){ok.classList.add('on');ok.onclick=()=>{
  R.answers[QN[curQ]]=SUBJ.map((_,i)=>mxRow[i]);R.rt[QN[curQ]]=Date.now()-t0;recordDone();advanceQ();};}}

/* ================= Q11 填空分配 ================= */
function renderAlloc(prev){
  mxEl.style.display='block';mxEl.innerHTML='';
  const head=document.createElement('div');head.className='mhead';
  head.innerHTML='<span class="mlab">责任主体</span><span class="mcel" style="justify-content:flex-start">分数（0–100）</span>';
  mxEl.appendChild(head);
  const inputs=[];
  SUBJ.forEach((sub,i)=>{const row=document.createElement('div');row.className='mrow';
    row.innerHTML='<span class="mlab">'+sub+'</span><span class="mcel" style="justify-content:flex-start">'+
      '<input class="ain" type="number" inputmode="numeric" min="0" max="100" value="'+(prev?prev[i]:'')+'">'+
      '<span style="color:var(--ink-dim);font-size:10px">分</span></span>';
    mxEl.appendChild(row);inputs.push(row.querySelector('.ain'));});
  const sum=document.createElement('div');sum.className='asum';
  sum.innerHTML='合计：<b id="asum">0</b> / 100';
  mxEl.appendChild(sum);
  const upd=()=>{let s=0;inputs.forEach(inp=>s+=(+inp.value||0));const el=$('#asum');el.textContent=s;
    sum.classList.toggle('good',s===100);ok.disabled=(s!==100);if(s!==100)ok.classList.add('on');};
  inputs.forEach(inp=>inp.addEventListener('input',upd));
  ok.classList.add('on');ok.disabled=true;
  ok.onclick=()=>{allocVals=inputs.map(inp=>Math.max(0,Math.min(100,+inp.value||0)));
    if(allocVals.reduce((a,b)=>a+b,0)!==100){warn.textContent='合计须为 100';warn.classList.add('on');setTimeout(()=>warn.classList.remove('on'),1400);return;}
    R.answers[QN[curQ]]=allocVals;R.rt[QN[curQ]]=Date.now()-t0;recordDone();advanceQ();};
  qtype.textContent='合计必须为 100 分';
  if(prev)upd();
}

/* ================= 记录 & 回退 ================= */
function recordDone(){done.push({step:step,q:curQ});}
function data_set(){R.answers[QN[curQ]]=(curQ==='q1'||QS[curQ].type==='s')?(sel[0]||''):sel.slice();
  R.rt[QN[curQ]]=Date.now()-t0;if(curQ==='q1'&&sel[0]==='从未使用')R.skip_daily=true;recordDone();}
function advanceQ(){
  if(curQ==='q1'&&R.skip_daily){const idx=FLOW.findIndex(f=>f.skipIntro);step=idx-1;}
  step++;run();
}
back.onclick=()=>{
  if(!done.length)return;
  const last=done.pop();
  delete R.answers[QN[last.q]];delete R.rt[QN[last.q]];
  if(last.q==='q1')R.skip_daily=false;
  step=FLOW.findIndex(f=>f.q===last.q);
  curQ=last.q;t0=Date.now();
  clearUI();
  back.classList.add('on');
  renderQBack(last.q);
};
function renderQBack(qid){
  const q=QS[qid];
  if(q.type==='alloc'){renderAlloc();return;}
  showText(q.ask);
  if(q.type==='mx'){if(q.clue)showNews(q);else renderMatrix(q);qtype.textContent='4 个主体均需作答';return;}
  if(q.type==='tx'){txin.classList.add('on');qtype.textContent='选填';ok.classList.add('on');
    ok.onclick=()=>{R.answers[QN[qid]]=txin.value.trim();R.rt[QN[qid]]=Date.now()-t0;recordDone();advanceQ();};return;}
  renderOpts(q.o,q.type);
  qtype.textContent=q.type==='s'?'单选':(q.type==='l2'||q.type==='l2m'?'最多选 2 项':q.type==='l3'?'限选 3 项·按重要性点击':'多选');
  back.classList.add('on');
}

/* ================= 主流程 ================= */
function renderQ(qid){
  const q=QS[qid];
  if(q.type==='alloc'){renderAlloc();return;}
  showText(q.ask);
  if(q.type==='mx'){
    if(q.clue){showNews(q);}
    else renderMatrix(q);
    qtype.textContent='4 个主体均需作答';return;
  }
  if(q.type==='tx'){txin.classList.add('on');qtype.textContent='选填';ok.classList.add('on');
    ok.onclick=()=>{R.answers[QN[qid]]=txin.value.trim();R.rt[QN[qid]]=Date.now()-t0;recordDone();advanceQ();};return;}
  renderOpts(q.o,q.type);
  qtype.textContent=q.type==='s'?'单选':(q.type==='l2'||q.type==='l2m'?'最多选 2 项':q.type==='l3'?'限选 3 项·按重要性点击':'多选');
}

function run(){
  clearUI();
  if(step>=FLOW.length){finish();return;}
  prog.style.width=Math.round(step/FLOW.length*100)+'%';
  const f=FLOW[step];
  if(f.s){
    setScene(f.s,f);
    if(f.card){showCards(f.card);showText('本场景涉及四个责任主体：');return;}
    showText(esc(f.t).replace(/\n/g,'<br>'));
    return;
  }
  if(f.q){curQ=f.q;t0=Date.now();back.classList.add('on');renderQ(f.q);return;}
}

function next(){
  const f=FLOW[step];
  if(!f||!f.s)return;
  step++;
  if(FLOW[step]&&FLOW[step].s&&FLOW[step].s!==f.s)showChapter(FLOW[step].s,()=>run());
  else run();
}
stage.addEventListener('click',e=>{
  if(card.classList.contains('on'))return;
  if(e.target.closest('.opt')||e.target.closest('.mbtn')||e.target.closest('#ok')||
     e.target.closest('#txin')||e.target.closest('.cb')||e.target.closest('.ain')||
     e.target.closest('#back'))return;
  const f=FLOW[step];if(f&&f.s)next();
});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){const f=FLOW[step];if(f&&f.s)next();}});

/* ================= 幕间卡 ================= */
const CH={room:['第一幕','日常使用'],car:['第二幕','事故现场'],stars:['第三幕','责任的追问'],archive:['第四幕','档案登记']};
function showChapter(sc,cb){const c=CH[sc]||['',''];
  card.innerHTML='<div class="ct">'+c[0]+'</div><div class="hr"></div>'+
    '<div class="cs" style="color:var(--ink);font-size:13px">'+c[1]+'</div>';
  card.classList.add('on');card.onclick=null;
  setTimeout(()=>{card.onclick=()=>{card.classList.remove('on');card.onclick=null;cb();};},220);}

/* ================= 收尾：责任画像 ================= */
function finish(){
  prog.style.width='100%';
  const payload={sid:R.sid,version:R.version,startedAt:R.startedAt,finishedAt:Date.now(),
    durationMs:Date.now()-R.startedAt,skip_daily:R.skip_daily,answers:R.answers,rt:R.rt,ua:navigator.userAgent};
  try{localStorage.setItem('aisurvey_last',JSON.stringify(payload));}catch(e){}
  setScene('archive');
  const st=$('#stamp');st.style.transition='transform .18s ease-in';st.style.transformOrigin='433px 150px';
  st.style.transform='translateY(-40px)';
  setTimeout(()=>{st.style.transform='translateY(0) scale(1.06)';burst(433,150,18,'#f0b429',3.4);},180);
  setTimeout(()=>{st.style.transform='translateY(0) scale(1)';},340);
  setTimeout(()=>{portrait(payload);},900);
}
function portrait(payload){
  const alloc=(payload.answers.q11_alloc&&payload.answers.q11_alloc.length===4)?payload.answers.q11_alloc:[25,25,25,25];
  const topIdx=alloc.indexOf(Math.max.apply(null,alloc));
  let bars='';SUBJ.forEach((n,i)=>{bars+=
    '<div class="prow"><span class="plab">'+n+'</span><span class="pbar"><span class="pfill" style="width:'+alloc[i]+'%"></span></span>'+
    '<span class="pval">'+alloc[i]+'分</span></div>';});
  const hasApi=QS_CONFIG.api&&QS_CONFIG.api.length>0&&location.protocol!=='file:';
  card.innerHTML='<div class="ct">你的责任画像</div><div class="hr"></div>'+
    '<div id="portrait">'+bars+'</div>'+
    '<div class="cs">在你看来，责任最重的是：<b style="color:var(--warm)">'+SUBJ[topIdx]+'</b><br>'+
    '感谢你的参与，这份判断将被匿名用于研究。</div>'+
    (hasApi?'<div class="cs" id="st">正在上传…</div>':'<div class="cs">数据已保存在本机</div>');
  card.classList.add('on');card.onclick=null;
  if(hasApi)submit(payload);
}
function exportFile(payload){const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(QS_CONFIG.exportName||'survey')+'_'+R.sid+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function submit(payload){const h={'Content-Type':'application/json'};if(QS_CONFIG.token)h['Authorization']='Bearer '+QS_CONFIG.token;
  fetch("https://ai-resps-api.celin-wang.workers.dev",{method:'POST',headers:h,body:JSON.stringify(payload)}).then(r=>{if(!r.ok)queue(payload);}).catch(()=>queue(payload));}
function queue(payload){try{const q=JSON.parse(localStorage.getItem('aisurvey_queue')||'[]');q.push(payload);localStorage.setItem('aisurvey_queue',JSON.stringify(q));}catch(e){}}
(function retry(){try{const api=QS_CONFIG.api;if(!api)return;const q=JSON.parse(localStorage.getItem('aisurvey_queue')||'[]');if(!q.length)return;
  const h={'Content-Type':'application/json'};if(QS_CONFIG.token)h['Authorization']='Bearer '+QS_CONFIG.token;
  const rest=[];Promise.all(q.map(p=>fetch("https://ai-resps-api.celin-wang.workers.dev",{method:'POST',headers:h,body:JSON.stringify(p)}).then(r=>{if(!r.ok)rest.push(p);}).catch(()=>rest.push(p))))
    .then(()=>localStorage.setItem('aisurvey_queue',JSON.stringify(rest)));}catch(e){}})();

/* ================= 启动 ================= */
showChapter('room',run);
</script>
</body>
</html>
